# Builds and tests the extension. After a merge (push) to main that changes
# source files it replaces the release "latest" with the new package; changes
# to documentation, tests or this automation alone build no release. Pull
# requests are always built and tested; "Run workflow" on main releases on
# demand. The tests inside VS Code (test/e2e) run locally only.
name: Release latest

on:
  push:
    branches: [main]
    # every other file counts as source: code, grammars, the Dockerfile,
    # package.json, build.sh, LICENSE (it is part of the package)
    paths-ignore:
      - '**.adoc'
      - '**.md'
      - 'assets/**'
      - 'test/**'
      - '.github/**'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # the same image users get: build.sh takes the USE libraries from it,
      # and the language server is also tested inside the container
      - name: Build container image
        run: docker build -t use-ocl:7.5.0 container

      - name: Build and test
        run: ./build.sh test

      - name: Replace release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          cp "use-ocl-$version.vsix" use-ocl.vsix
          cat > notes.md <<EOF
          Built automatically from \`main\` (commit ${GITHUB_SHA}).

          Installation: download \`use-ocl.vsix\`, then run \`code --install-extension use-ocl.vsix\`, or choose *Install from VSIX…* in the *…* menu of the *Extensions* view in VS Code.

          For validation, the extension needs Docker or Podman (it builds the image \`use-ocl:7.5.0\` on request) or Java 21 with a USE 7.5 installation; see the README.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest "use-ocl-$version.vsix" use-ocl.vsix \
            --target "$GITHUB_SHA" --latest \
            --title "use-ocl $version (main, ${GITHUB_SHA::7})" \
            --notes-file notes.md
