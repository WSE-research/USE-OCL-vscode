# Baut und testet die Erweiterung. Nach jedem Merge (Push) auf main ersetzt es
# das Release "latest" durch das neue Paket; bei Pull Requests nur bauen und
# testen. Die Tests in VS Code selbst (test/e2e) laufen nur lokal.
name: Release latest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # dasselbe Image wie für Nutzer: build.sh holt die USE-Bibliotheken
      # daraus, und der Sprachserver wird auch im Container getestet
      - name: Container-Image bauen
        run: docker build -t use-ocl:7.5.0 container

      - name: Bauen und testen
        run: ./build.sh test

      - name: Release "latest" ersetzen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          cp "use-ocl-$version.vsix" use-ocl.vsix
          cat > notes.md <<EOF
          Automatisch gebaut aus \`main\` (Commit ${GITHUB_SHA}).

          Installation: \`use-ocl.vsix\` herunterladen, dann \`code --install-extension use-ocl.vsix\` oder in VS Code unter „Erweiterungen“ → „…“ → „Aus VSIX installieren…“.

          Für die Prüfung braucht die Erweiterung Docker oder Podman (das Image \`use-ocl:7.5.0\` baut sie auf Wunsch selbst) oder Java 21 mit einer USE-7.5-Installation; siehe README.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest "use-ocl-$version.vsix" use-ocl.vsix \
            --target "$GITHUB_SHA" --latest \
            --title "use-ocl $version (main, ${GITHUB_SHA::7})" \
            --notes-file notes.md
